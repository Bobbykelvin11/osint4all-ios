name: OSINT4ALL
options:
  bundleIdPrefix: com.bobbymedia
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  OSINT4ALL:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: OSINT4ALL
        excludes:
          - "Resources/**"
          - "Info.plist"
      - path: OSINT4ALL/Resources/links.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bobbymedia.osint4all
        PRODUCT_NAME: OSINT4ALL
        INFOPLIST_FILE: OSINT4ALL/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO

schemes:
  OSINT4ALL:
    build:
      targets:
        OSINT4ALL: all
